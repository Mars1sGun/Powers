# yaml-language-server: $schema=../schemas/Superheroes8+.json
name: Evoker
colouredName: <dark_gray>[<dark_red>Evoker<dark_gray>]
description: Summon vexes and attack with fangs.
skills:
  giveSword:
    skill: GIVEITEM
    canStore: false
    canDrop: false
    canLoseOnDeath: false
    canDropOnDeath: false
    loseItemOnHeroLoss: false
    item:
      type: IRON_SWORD
      amount: 1
      metadata:
        displayName: <dark_red>Evoker's Sword
        isUnbreakable: true
        lore:
          - <italic><white>Right-click for <dark_red>Circle fang
  giveAxe:
    skill: GIVEITEM
    canStore: false
    canDrop: false
    canLoseOnDeath: false
    canDropOnDeath: false
    loseItemOnHeroLoss: false
    item:
      type: IRON_AXE
      amount: 1
      metadata:
        displayName: <dark_red>Evoker's Axe
        isUnbreakable: true
        lore:
          - <italic><white>Right-click for <dark_red>Straight fang
  totemPassive:
    skill: CUSTOM
    trigger:
      type: LOOP
      period: 2s
    conditions:
      healthCheck:
        type: HEALTH
        mode: SELF
        healthPercentage:
          max: 10
      totemCooldown:
        type: COOLDOWN
        cooldown: 60
        mode: SELF
    effects:
      giveTotem:
        type: GIVEITEM
        mode: SELF
        item:
          type: TOTEM_OF_UNDYING
          amount: 1
  setupTeam:
    skill: CUSTOM
    trigger:
      type: GAINEDHERO
    effects:
      createTeam:
        type: COMMAND
        mode: SELF
        executor: CONSOLE
        commands:
          - "team add evoker_team"
          - "team modify evoker_team friendlyfire false"
          - "team join evoker_team %self_name%"
  circleFang:
    skill: CUSTOM
    trigger:
      type: INTERACT
      actions:
        - RIGHT_CLICK_AIR
        - RIGHT_CLICK_BLOCK
    conditions:
      holdingSword:
        type: ITEM
        mode: SELF
        slot: HAND
        item:
          type: IRON_SWORD
      attackCooldown:
        type: COOLDOWN
        cooldown: 12
        mode: SELF
        else:
          cooldownmsg:
            type: ACTIONBAR
            mode: SELF
            message: "<dark_red>Circle fang <gray>on cooldown!"
    effects:
      circle:
        type: COMMAND
        mode: SELF
        executor: CONSOLE
        commands:
          - "execute as %self_name% at %self_name% run summon minecraft:evoker_fangs ^2.0 ^ ^0 {Warmup:0}"
          - "execute as %self_name% at %self_name% run summon minecraft:evoker_fangs ^1.4 ^ ^1.4 {Warmup:3}"
          - "execute as %self_name% at %self_name% run summon minecraft:evoker_fangs ^0 ^ ^2.0 {Warmup:6}"
          - "execute as %self_name% at %self_name% run summon minecraft:evoker_fangs ^-1.4 ^ ^1.4 {Warmup:9}"
          - "execute as %self_name% at %self_name% run summon minecraft:evoker_fangs ^-2.0 ^ ^0 {Warmup:12}"
          - "execute as %self_name% at %self_name% run summon minecraft:evoker_fangs ^-1.4 ^ ^-1.4 {Warmup:15}"
          - "execute as %self_name% at %self_name% run summon minecraft:evoker_fangs ^0 ^ ^-2.0 {Warmup:18}"
          - "execute as %self_name% at %self_name% run summon minecraft:evoker_fangs ^1.4 ^ ^-1.4 {Warmup:21}"
      summonVexes:
        type: COMMAND
        mode: SELF
        executor: CONSOLE
        commands:
          - "execute as %self_name% at %self_name% run summon minecraft:vex ^1 ^ ^0 {Tags:[\"evoker_vex\"]}"
          - "execute as %self_name% at %self_name% run summon minecraft:vex ^-1 ^ ^0 {Tags:[\"evoker_vex\"]}"
      joinVexes:
        type: COMMAND
        mode: SELF
        executor: CONSOLE
        commands:
          - "team join evoker_team @e[type=vex,tag=evoker_vex,sort=nearest,limit=2]"
      sound:
        type: SOUND
        mode: SELF
        sound:
          sound: entity.evoker.prepare_summon
          volume: 1
          pitch: 1
  straightFang:
    skill: CUSTOM
    trigger:
      type: INTERACT
      actions:
        - RIGHT_CLICK_AIR
        - RIGHT_CLICK_BLOCK
    conditions:
      holdingAxe:
        type: ITEM
        mode: SELF
        slot: HAND
        item:
          type: IRON_AXE
      attackCooldown:
        type: COOLDOWN
        cooldown: 8
        mode: SELF
        else:
          cooldownmsg:
            type: ACTIONBAR
            mode: SELF
            message: "<dark_red>Straight fang <gray>on cooldown!"
    effects:
      straight:
        type: COMMAND
        mode: SELF
        executor: CONSOLE
        commands:
          - "execute as %self_name% at %self_name% run summon minecraft:evoker_fangs ^ ^ ^1 {Warmup:0}"
          - "execute as %self_name% at %self_name% run summon minecraft:evoker_fangs ^ ^ ^2 {Warmup:5}"
          - "execute as %self_name% at %self_name% run summon minecraft:evoker_fangs ^ ^ ^3 {Warmup:10}"
          - "execute as %self_name% at %self_name% run summon minecraft:evoker_fangs ^ ^ ^4 {Warmup:15}"
      sound:
        type: SOUND
        mode: SELF
        sound:
          sound: entity.evoker.cast_spell
          volume: 1
          pitch: 1
