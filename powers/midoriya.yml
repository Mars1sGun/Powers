name: Midoriya
colouredName: "<gradient:#C9F2DC:#cc0000><b>Midoriya"
description: "You are Midoriya, the Ninth Holder of One For All"
# The custom skin feature in SuperheroesPlusUltra only works on servers running paper! See papermc.io
# This is because it requires Player#setPlayerProfile to work correctly! It saves development time
# depending on paper rather than maintaining this feature across multiple versions of Minecraft myself.
# You can find skins with values and signatures at https://mineskin.org/
skin:
  value: 
  signature: 
skills:
  toggle:
    skill: CUSTOM
    trigger:
      type: PLAYERJUMP
      conditions:
        sneak:
          type: SNEAK
          mode: SELF
        metadata:
          type: METADATA
          mode: SELF
          variable: MIDORIYAPOWER
          comparison: ">"
          value: 0
          else:
            metadata:
              type: METADATA
              variable: MIDORIYAPOWER
              mode: SELF
              operation: SET
              value: 1
            message:
              type: ACTIONBAR
              mode: SELF
              message: "Full Cowling has been <green>enabled</green>! (Disable by sneak jumping)"
            playThemeSong:
              type: PLAYTRACK
              track: "myheroacademiathemesong.nbs"
    effects:
      metadata:
        type: METADATA
        variable: MIDORIYAPOWER
        mode: SELF
        operation: SET
        value: 0
      message:
        type: ACTIONBAR
        mode: SELF
        message: "Full Cowling has been <red>disabled</red>! (Enable by sneak jumping)"
      potion:
        type: REMOVEPOTION
        mode: SELF
        types:
          - SPEED
  damageFromPower:
    skill: CUSTOM
    trigger:
      type: LOOP
      period: 6
      conditions:
        metadata:
          type: METADATA
          mode: SELF
          variable: MIDORIYAPOWER
          comparison: ">"
          value: 0
    effects:
      damage:
        type: DAMAGE
        mode: SELF
        damage: 2 * self_MIDORIYAPOWER # example of variable usage
  speed:
    skill: POTIONEFFECT
    type: SPEED
    potency: 2
    conditions:
      metadata:
        type: METADATA
        mode: SELF
        variable: MIDORIYAPOWER
        comparison: ">"
        value: 0
  haste:
    skill: POTIONEFFECT
    type: HASTE
    potency: 1
    conditions:
      metadata:
        type: METADATA
        mode: SELF
        variable: MIDORIYAPOWER
        comparison: ">"
        value: 0
  noFallDamage:
    skill: DAMAGERESISTANCE
    conditions:
      metadata:
        type: METADATA
        mode: SELF
        variable: MIDORIYAPOWER
        comparison: ">"
        value: 0
    damageMultiplier: 0.25
    damageCause:
      - FALL
  leap:
    skill: SLAM
    conditions:
      metadata:
        type: METADATA
        mode: SELF
        variable: MIDORIYAPOWER
        comparison: ">"
        value: 0
      sneak:
        type: SNEAK
        mode: SELF
        sneak: false
    item:
      type: AIR
    cooldown: 10
    airCooldown: 10
    foodCost: 0
    minimumFood: 0
    radius: 1
    damage: 0
    cooldownMessage: 'Leap Cooldown: <currentcooldown> seconds'
  punch:
    skill: CUSTOM
    trigger:
      type: DAMAGEDENTITY
      conditions:
        sneak:
          type: SNEAK
          mode: SELF
        item:
          type: ITEM
          mode: SELF
          item:
            type: AIR
        cooldown:
          type: COOLDOWN
          mode: SELF
          cooldown: 60
          else:
            message:
              type: ACTIONBAR
              mode: SELF
              message: "Detroit Smash is still on cooldown!"
    effects:
      message:
        type: MESSAGE
        mode: SELF
        message: "You used Detroit Smash!"
      aoe:
        type: AOE
        radius: 16
        effects:
          velocity:
            type: REPULSE
            mode: OTHER
            velocity: 1
          message:
            type: MESSAGE
            mode: OTHER
            message: "<player> has used Detroit Smash!"
      velocity:
        type: REPULSE
        mode: OTHER
        velocity: 1.9
      damage:
        type: DAMAGE
        mode: OTHER
        damage: 8
        shouldTriggerEvents: true





