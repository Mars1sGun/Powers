name: Zombie
colouredName: "<gradient:#537f2e:#78f211><b>Zombie"
description: "You are a zombie!"
# The custom skin feature in SuperheroesPlusUltra only works on servers running paper! See papermc.io
# This is because it requires Player#setPlayerProfile to work correctly! It saves development time
# depending on paper rather than maintaining this feature across multiple versions of Minecraft myself.
# You can find skins with values and signatures at https://mineskin.org/
skin:
  value: 
  signature: 
skills:
  preventtarget:
    skill: CUSTOM
    trigger:
      type: TARGETED
      conditions:
        entity:
          type: ENTITY
          mode: OTHER
          entities:
            - ZOMBIE
            - ZOMBIE_VILLAGER
    effects:
      cancel:
        type: CANCEL
        mode: SELF
  burnInSunlight:
    skill: CUSTOM
    trigger:
      type: LOOP
      period: 1
      conditions:
        light:
          type: LIGHT
          mode: SELF
          lightRange: 15 - 200
          checkNaturalLight: true
          checkBlockLight: false
        time:
          type: TIME
          mode: SELF
          time: 0 - 12000
        item:
          type: ITEM
          slot: HEAD
          mode: SELF
          item:
            types:
              - AIR
    effects:
      burn:
        type: IGNITE
        mode: SELF
        fireTicks: 40
  knock_up:
    skill: CUSTOM
    trigger:
      type: DAMAGEDENTITY
    effects:
      velocity:
        type: VELOCITY
        mode: OTHER
        value: 0.5
        operation: ADD
  resistance:
    skill: POTIONEFFECT
    type: RESISTANCE
    potency: 1




