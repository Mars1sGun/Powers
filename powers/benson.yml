name: Benson
colouredName: <bold><green>Benson
description: Fly like Tinkerbell! Your flight is disabled when you hit someone or get hit.
skin:
  value: 
  signature: 
skills:
  flight:
    skill: FLIGHT
  hitDisable:
    skill: CUSTOM
    trigger:
      type: DAMAGEDENTITY
      conditions:
        targetIsPlayer:
          type: ENTITY
          mode: OTHER
          whitelist: true
          entities:
            - PLAYER
        cooldown:
          type: COOLDOWN
          cooldown: 5
          mode: SELF
          else:
            msg:
              type: ACTIONBAR
              mode: SELF
              message: "<red>Benson is disabled for 5s!"
    effects:
      disableFlight:
        type: COMMAND
        executor: CONSOLE
        commands:
          - "fly %self_name% disable"
      slow:
        type: POTION
        mode: SELF
        potion:
          type: SLOWNESS
          potency: 2
          duration: 5
      weakness:
        type: POTION
        mode: SELF
        potion:
          type: WEAKNESS
          potency: 5
          duration: 5
      blindness:
        type: POTION
        mode: SELF
        potion:
          type: BLINDNESS
          potency: 1
          duration: 3
      reEnable:
        type: WAIT
        delay: 5
        effects:
          enableFlight:
            type: COMMAND
            executor: CONSOLE
            commands:
              - "fly %self_name% enable"
  hitTakenDisable:
    skill: CUSTOM
    trigger:
      type: DAMAGEDBYENTITY
      conditions:
        targetIsPlayer:
          type: ENTITY
          mode: OTHER
          whitelist: true
          entities:
            - PLAYER
        cooldown:
          type: COOLDOWN
          cooldown: 5
          mode: SELF
          else:
            msg:
              type: ACTIONBAR
              mode: SELF
              message: "<red>Benson is disabled for 5s!"
    effects:
      disableFlight:
        type: COMMAND
        executor: CONSOLE
        commands:
          - "fly %self_name% disable"
      slow:
        type: POTION
        mode: SELF
        potion:
          type: SLOWNESS
          potency: 2
          duration: 5
      weakness:
        type: POTION
        mode: SELF
        potion:
          type: WEAKNESS
          potency: 5
          duration: 5
      blindness:
        type: POTION
        mode: SELF
        potion:
          type: BLINDNESS
          potency: 1
          duration: 3
      reEnable:
        type: WAIT
        delay: 5
        effects:
          enableFlight:
            type: COMMAND
            executor: CONSOLE
            commands:
              - "fly %self_name% enable"
