name: Homelander
colouredName: "<bold><#FF0000>H<#FF2222>o<#FF4444>m<#FF6666>e<#FF8888>l<#FFAAAA>a<#FFCCCC>n<#FFEEEE>d<#EEEEFF>e<#CCCCFF>r</bold>"
description: Fly through the skies and blast foes with your laser vision and fireballs!

skin:
  value: 
  signature: 

