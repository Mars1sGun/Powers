name: Flasher
colouredName: <bold><yellow>Flasher
description: Sneak to blind nearby players, but slow yourself down.

skills:
  flash:
    skill: CUSTOM
    trigger:
      type: SNEAK
      conditions:
        cooldown:
          type: COOLDOWN
          cooldown: 60
          mode: SELF
          else:
            cooldownmsg:
              type: ACTIONBAR
              mode: SELF
              message: "<red>Wait before flashing people again!"
    effects:
      blindarea:
        type: AOE
        mode: SELF
        radius: 20
        effects:
          darkness:
            type: POTION
            mode: OTHER
            potion:
              type: BLINDNESS
              potency: 1
              duration: 10
          slowself:
            type: POTION
            mode: SELF
            potion:
              type: SLOWNESS
              potency: 10
              duration: 10