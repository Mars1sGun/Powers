# yaml-language-server: $schema=../schemas/Superheroes8+.json
name: Timeweaver
colouredName: <bold><dark_purple>Time<dark_gray>weaver
description: Stop time and teleport through space.
skills:
  teleport:
    skill: TELEPORT
    actions:
      - LEFT_CLICK_AIR
      - LEFT_CLICK_BLOCK
    distance: 30
    yAxisMultiplier: 0.75
    teleportCause: ENDER_PEARL
    cooldown: 5
    cooldownMessage: "<dark_purple>Blink <gray>cooldown: <currentcooldown> seconds"
    particle:
      particle: PORTAL
      shape:
        type: HELIX
      duration: 2
      amount: 2
  timeStop:
    skill: CUSTOM
    trigger:
      type: SNEAK
      conditions:
        cooldown:
          type: COOLDOWN
          cooldown: 100
          mode: SELF
          else:
            cooldownmsg:
              type: ACTIONBAR
              mode: SELF
              message: "<dark_purple>Time Stop <gray>is on cooldown!"
    effects:
      selfSpeed:
        type: POTION
        mode: SELF
        potion:
          type: SPEED
          potency: 5
          duration: 10
      freezeEntities:
        type: AOE
        mode: SELF
        radius: 5
        effects:
          slowness:
            type: POTION
            mode: OTHER
            potion:
              type: SLOWNESS
              potency: 10
              duration: 15
      freezeCmd:
        type: COMMAND
        mode: SELF
        executor: CONSOLE
        commands:
          - "tick freeze"
      wait:
        type: WAIT
        delay: 5
        effects:
          unfreezeCmd:
            type: COMMAND
            mode: SELF
            executor: CONSOLE
            commands:
              - "tick unfreeze"
      timeSound:
        type: SOUND
        mode: SELF
        sound:
          sound: entity.illusioner.prepare_mirror
          volume: 5
          pitch: 0.5
