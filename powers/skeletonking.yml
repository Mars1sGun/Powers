name: SkeletonKing
colouredName: "<white><b>Skeleton</b></white> <gold><b>King</b></gold>"
description: "You lead an army of skeletons!"
# The custom skin feature in SuperheroesPlusUltra only works on servers running paper! See papermc.io
# This is because it requires Player#setPlayerProfile to work correctly! It saves development time
# depending on paper rather than maintaining this feature across multiple versions of Minecraft myself.
# You can find skins with values and signatures at https://mineskin.org/
skin:
  value: 
  signature: 
skills:
  preventtarget:
    skill: CUSTOM
    trigger:
      type: TARGETED
      conditions:
        entity:
          type: ENTITY
          mode: OTHER
          entities:
            - SKELETON
            - WITHER_SKELETON
    effects:
      cancel:
        type: CANCEL
        mode: SELF
  skeletonController:
    skill: BEASTCONTROL
    conditions:
      isSkeleton:
        type: ENTITY
        mode: OTHER
        entities:
          - SKELETON
          - WITHER_SKELETON
    maxDistance: 32
    targetMobs: true
    glowDuration: 3.0
    attackItself: false
  spawnSkeleton:
    skill: CUSTOM
    trigger:
      type: LOOP
      period: 60
    conditions:
      chance:
        type: CHANCE
        chance: 0.9
        else:
          spawn:
            type: SPAWNENTITY
            entity:
              type: WITHER_SKELETON
              equipment:
                helmet:
                  type: IRON_HELMET
    effects:
      spawn:
        type: SPAWNENTITY
        entity:
          type: SKELETON
          equipment:
            helmet:
              type: LEATHER_HELMET
