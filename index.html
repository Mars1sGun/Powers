function render(){const e=document.getElementById("app");let h='<div class="howto-box"><h2>⚡ How to Get Powers</h2><ol><li><strong>Craft a PowerShard</strong> — 8 amethyst shards + a tier item around it in a crafting table. Each tier (S++ through F-) needs a different item.</li><li><strong>Right-click the PowerShard</strong> to reroll a random power from that tier. The tier item determines which tier you roll.</li><li><strong>Find TempU potions</strong> in structure chests (25% chance) or buy from the Wandering Trader. Drink for a random hero (or boost your current one).</li><li><strong>Find CompoundU potions</strong> in structure chests (25% chance) — high risk, high reward. Random hero from a tier with a chance of death.</li><li><strong>Secret powers</strong> have special unlock methods — use <code>/powers clues</code> on Discord to find them.</li></ol></div>';h+='<div class="craft-section"><h2>🔨 Crafting Recipes</h2><p style="color:#999;font-size:.8rem;text-align:center;margin-bottom:.75rem">Each PowerShard: 8 Amethyst Shards + the tier item below in a 3x3 grid</p><div class="craft-powershard">';TIERS.forEach(t=>{h+=`<div class="craft-card"><div class="craft-label" style="font-size:.7rem;color:#4fc3f7;margin-bottom:.25rem">${TIER_ITEMS[t.label]}</div><img src="${IMG}craft_${TIER_KEYS[t.label]}.png" alt="${t.label} PowerShard" loading="lazy"><div class="craft-label">${t.label} PowerShard</div></div>`});h+=`</div><h2 style="color:#4fc3f7;font-size:1.1rem;font-weight:800;margin:1rem 0 .5rem;text-align:center">PowerStorer</h2><p style="color:#999;font-size:.8rem;text-align:center;margin-bottom:.75rem">4 same-tier PowerShards in a 2x2 grid</p><div class="craft-card" style="max-width:220px;margin:0 auto"><img src="${IMG}craft_powerstorer.png" alt="PowerStorer" loading="lazy"><div class="craft-label">PowerStorer</div></div></div>`;if(S>0){h+='<div class="secret-banner">There are <strong>'+S+'</strong> secret powers not shown — obtainable only through special means!</div>'}e.innerHTML=h+TIERS.map((t,i)=>{const r=t.id!="spp"?"collapsed":"";return`<div class="tier ${C[t.id]} ${r}" onclick="this.classList.toggle('collapsed')"><div class="tier-header"><span class="tier-rank">${t.label}</span><span class="tier-item">${t.label} PowerShard</span><span class="tier-rarity">${t.heroes.length} powers</span><span class="tier-toggle">▼</span></div><div class="tier-content">${t.heroes.map(h=>`<div class="hero-card${h.name==='Powerless'?' powerless':''}"><h3>${h.name}</h3><div class="hero-desc">${h.desc}</div><div class="hero-meta"><span class="meta-tag howto">${h.howto}</span><span class="meta-tag">${h.effects}</span><span class="meta-tag chance">${h.chance}</span><span class="meta-tag obtain">${h.obtain}</span></div></div>`).join("")}</div></div>`}).join("")}render();
